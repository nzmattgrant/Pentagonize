<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta name="description" content="Pentagonize is a two-player strategy board game. Get 5 marbles in a row while sliding the board to outmaneuver your opponent.">
    <meta property="og:title" content="Pentagonize">
    <meta property="og:description" content="Pentagonize is a two-player strategy board game.">
    <meta property="og:image" content="<%= BASE_URL %>/img/icons/icon.png">
    <link rel="shortcut icon" href="<%= BASE_URL %>favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <title><%= VUE_APP_TITLE %></title>
    <% if (typeof VUE_APP_ADSENSE_PUB_ID !== 'undefined' && VUE_APP_ADSENSE_PUB_ID) { %>
      <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=<%= VUE_APP_ADSENSE_PUB_ID %>" crossorigin="anonymous"></script>
    <% } %>
  </head>
  <body>
    <noscript>
      <strong>We're sorry but Pentagonize doesn't work without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app"></div>
  </body>
</html>
